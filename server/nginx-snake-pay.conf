# 轻量应用服务器 · Nginx 反代 + HTTPS（支付宝 notify 必须 HTTPS）
# 把下面 pay.yourdomain.com 改成你解析到本服务器的域名
# 证书可用 腾讯云免费 SSL 或 certbot(Let's Encrypt) 签发

server {
    listen 80;
    server_name pay.yourdomain.com;
    # 强制跳转 HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name pay.yourdomain.com;

    ssl_certificate     /etc/ssl/pay/fullchain.pem;
    ssl_certificate_key /etc/ssl/pay/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 支付宝 notify 是 POST form，proxy 默认允许
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
